name: Idea or flavour
description: A feature, a change, or a flavour you made and want to share
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What it would do and when you would use it.
    validations:
      required: true
  - type: textarea
    id: flavour
    attributes:
      label: Flavour file
      description: If this is a flavour, paste the JSON and say how the wallpaper was made (only your own work or CC0).
      render: json
